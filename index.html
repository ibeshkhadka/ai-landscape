<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Model Tracker — AI Landscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="loader"></div>
  <div class="loading-text">Reloading</div>
</div>

<div class="container">
  <div class="topbar">
    <div class="brand">AI <span>Model Tracker</span></div>
    <nav class="topnav">
      <a href="index.html" class="active">Companies</a>
    </nav>
  </div>

  <div class="header">
    <h1>AI Model Tracker</h1>
    <div class="subtitle" id="subtitle">Companies and their latest models.</div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input type="text" id="searchInput" placeholder="Search companies, models, tags..." autocomplete="off">
    </div>
    <span class="chip-divider"></span>
    <button class="chip type-text" data-type="text">Text</button>
    <button class="chip type-image" data-type="image">Image</button>
    <button class="chip type-audio" data-type="audio">Audio</button>
    <button class="chip type-video" data-type="video">Video</button>
  </div>

  <div class="stats" id="stats"></div>

  <div id="sections"></div>

  <div class="empty-state" id="emptyState">
    No companies match your filters. Try clearing the search or a filter.
  </div>

  <div class="footer" id="footer"></div>
</div>

<script src="data/companies.js"></script>
<script src="data/media/image.js"></script>
<script src="data/media/video.js"></script>
<script>
(function () {
  'use strict';
  var COMPANIES = window.AI_COMPANIES || [];

  // Merge image/video generation models (data/media/*) back into their companies
  [window.AI_IMAGE_MODELS, window.AI_VIDEO_MODELS].forEach(function (group) {
    if (!group) return;
    Object.keys(group).forEach(function (slug) {
      var c = COMPANIES.filter(function (x) { return x.slug === slug; })[0];
      if (c) c.models = c.models.concat(group[slug]);
    });
  });
  var REGIONS = {
    us:     { label: 'America',        cls: 'cat-us' },
    europe: { label: 'Europe',         cls: 'cat-europe' },
    china:  { label: 'China',          cls: 'cat-china' },
    infra:  { label: 'Infrastructure', cls: 'cat-infra' }
  };
  // Model-kind groups for the Text / Image / Audio / Video filter
  var TYPE_GROUPS = {
    text:  ['llm', 'vlm'],
    image: ['image', 'd3d'],
    audio: ['audio', 'voice'],
    video: ['video']
  };
  // Media-only companies (all models are image/video/audio) are hidden unless
  // their matching type filter is active
  var MEDIA_TYPES = ['image', 'video', 'audio', 'voice', 'd3d'];
  function isMediaOnly(c) {
    return c.models.length > 0 && c.models.every(function (m) { return MEDIA_TYPES.indexOf(m.type) !== -1; });
  }
  var state = { q: '', type: null };

  var fmtDate = function (iso) {
    var d = new Date(iso + 'T00:00:00Z');
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
  };

  function companyMatches(c) {
    if (state.type) {
      if (!c.models.some(function (m) { return TYPE_GROUPS[state.type].indexOf(m.type) !== -1; })) return false;
    } else if (isMediaOnly(c)) {
      return false;
    }
    if (state.q) {
      var q = state.q.toLowerCase();
      var hay = (c.name + ' ' + c.tagline + ' ' + c.retention + ' ' +
        c.tags.map(function (t) { return t.label; }).join(' ') + ' ' +
        c.models.map(function (m) { return m.name + ' ' + m.desc; }).join(' ')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function renderStats() {
    var open = COMPANIES.filter(function (c) { return c.tags.some(function (t) { return t.type === 'open'; }); }).length;
    var closed = COMPANIES.filter(function (c) { return c.tags.some(function (t) { return t.type === 'closed'; }); }).length;
    var agents = COMPANIES.filter(function (c) { return c.tags.some(function (t) { return t.type === 'agent'; }); }).length;
    var models = COMPANIES.reduce(function (n, c) { return n + c.models.length; }, 0);
    var latest = COMPANIES.reduce(function (max, c) {
      c.models.forEach(function (m) { if (m.released && m.released > max) max = m.released; });
      return max;
    }, '');
    document.getElementById('stats').innerHTML =
      '<div class="stat"><b>' + COMPANIES.length + '</b> companies</div>' +
      '<div class="stat"><b>' + models + '</b> models tracked</div>' +
      '<div class="stat"><span class="dot open"></span><b>' + open + '</b> open</div>' +
      '<div class="stat"><span class="dot closed"></span><b>' + closed + '</b> closed</div>' +
      '<div class="stat"><span class="dot agent"></span><b>' + agents + '</b> agent platforms</div>' +
      '<div class="stat">latest release <b>' + fmtDate(latest) + '</b></div>';
  }

  function renderSections() {
    var container = document.getElementById('sections');
    var empty = document.getElementById('emptyState');
    var html = '';
    var any = false;

    Object.keys(REGIONS).forEach(function (key) {
      var region = REGIONS[key];
      var list = COMPANIES.filter(function (c) { return c.region === key && companyMatches(c); });
      if (!list.length) return;
      any = true;
      html += '<div class="category-section ' + region.cls + '">' +
        '<div class="category-header"><h2>' + region.label + '</h2>' +
        '<div class="category-line"></div><span class="badge">' + region.label + '</span></div>' +
        '<div class="companies-grid">' + list.map(cardHtml).join('') + '</div></div>';
    });

    container.innerHTML = html;
    empty.style.display = any ? 'none' : 'block';
  }

  function cardHtml(c) {
    var tags = c.tags.map(function (t) {
      return '<span class="meta-tag ' + t.type + '">' + t.label + '</span>';
    }).join('');
    return '<a class="company-card" href="pages/company.html?company=' + encodeURIComponent(c.slug) + '" style="animation-delay:' + (Math.random() * 0.15).toFixed(2) + 's">' +
      '<div class="company-header"><div class="company-name">' + c.name + '</div><div class="country-flag">' + c.flag + '</div></div>' +
      '<div class="company-tagline">' + c.tagline + '</div>' +
      '<div class="company-meta">' + tags + '</div>' +
      '<div class="retention-hook">' + c.retention + '</div>' +
      '<div class="updated-tag">updated ' + fmtDate(c.updated || '2026-08-13') + '</div>' +
      '</a>';
  }

  function apply() {
    renderSections();
    var subtitle = document.getElementById('subtitle');
    subtitle.innerHTML = state.q
      ? 'Showing results for <b>&ldquo;' + escapeHtml(state.q) + '&rdquo;</b>'
      : 'Companies and their latest models. Updated <b>' + fmtDate('2026-08-13') + '</b>.';
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Wire up controls
  document.getElementById('searchInput').addEventListener('input', function (e) {
    state.q = e.target.value.trim();
    apply();
  });

  document.querySelectorAll('.chip[data-type]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.type = state.type === btn.dataset.type ? null : btn.dataset.type;
      document.querySelectorAll('.chip[data-type]').forEach(function (b) { b.classList.toggle('active', b === btn && !!state.type); });
      apply();
    });
  });

  // Loading overlay on navigation
  var overlay = document.getElementById('loadingOverlay');
  window.addEventListener('pageshow', function () { overlay.classList.remove('visible'); });
  window.addEventListener('beforeunload', function () { overlay.classList.add('visible'); });

  renderStats();
  apply();
})();
</script>
</body>
</html>
